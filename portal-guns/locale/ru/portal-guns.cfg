[mod-name]
portal-guns=Портальные пушки

[mod-description]
portal-guns=Ручная портальная пушка. Левый клик — синий портал, правый — оранжевый. Всё, что входит в один, выходит из другого: вы сами, ваша машина или танк на полной скорости, паукотроны и кусаки. У каждого игрока своя пара порталов.

[item-name]
portal-gun=Портальная пушка

[item-description]
portal-gun=Стреляет парой связанных порталов. Войдите, въезжайте или заманите кусак в один — они выйдут из другого, сохранив скорость.\n[font=default-semibold]Левый клик:[/font] синий портал\n[font=default-semibold]Правый клик:[/font] оранжевый портал\n[font=default-semibold]Shift + клик:[/font] закрыть портал этого цвета\nПорталы не открываются на воде, зданиях, деревьях, камнях и скалах.

[entity-name]
portal-guns-portal-blue=Синий портал
portal-guns-portal-orange=Оранжевый портал
portal-guns-placement-probe=Проверка места для портала

[entity-description]
portal-guns-portal-blue=Всё, что входит сюда, выходит из оранжевого портала того же владельца. Разберите портал, чтобы закрыть его.
portal-guns-portal-orange=Всё, что входит сюда, выходит из синего портала того же владельца. Разберите портал, чтобы закрыть его.

[technology-name]
portal-gun=Портальная пушка

[technology-description]
portal-gun=Ручное устройство, открывающее два связанных портала. Путешествуйте, перебрасывайте танк через всю карту на полном ходу или отправьте атаку кусак туда, где они об этом пожалеют.

[shortcut-name]
portal-guns-close-portals=Закрыть мои порталы

[controls]
portal-guns-close-portals=Закрыть мои порталы

[mod-setting-name]
portal-guns-range=Дальность портальной пушки
portal-guns-teleport-vehicles=Транспорт проходит через порталы
portal-guns-teleport-units=Кусаки и другие юниты проходят через порталы
portal-guns-cross-surface=Связывать порталы между поверхностями
portal-guns-owner-labels=Показывать владельцев порталов в режиме доп. информации (Alt)

[mod-setting-description]
portal-guns-range=Как далеко летит выстрел порталом, в клетках. Выстрел дальше приземлится на этом расстоянии.
portal-guns-teleport-vehicles=Машины, танки и паукотроны проходят через порталы (вместе с пассажирами). Машины сохраняют скорость.
portal-guns-teleport-units=Кусаки, плеваки и другие юниты, вошедшие в портал, выходят из другого.
portal-guns-cross-surface=Разрешить синему порталу на одной поверхности (планете) соединяться с оранжевым на другой. Так могут перемещаться только персонажи, машины, танки и паукотроны. По умолчанию выключено, потому что позволяет обойтись без ракет и космических платформ.
portal-guns-owner-labels=Подписывает имя владельца над каждым порталом, когда включён режим дополнительной информации (Alt).

[portal-guns]
fizzle=Здесь нельзя открыть портал
too-close=Слишком близко к другому порталу
failed=Портал не удалось открыть
wrong-surface=Стрелять порталами можно только на той поверхности, где вы находитесь
no-body=Чтобы стрелять из портальной пушки, нужно тело
no-portals=У вас нет открытых порталов
