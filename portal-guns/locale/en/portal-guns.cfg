[mod-name]
portal-guns=Portal Guns

[mod-description]
portal-guns=A handheld portal gun. Left click shoots a blue portal, right click an orange one; whatever goes into one comes out of the other: you, your car or tank at full speed, spidertrons and biters. Every player has their own pair.

[item-name]
portal-gun=Portal gun

[item-description]
portal-gun=Shoots a pair of linked portals. Walk, drive or lure biters into one and they come out of the other, keeping their speed.\n[font=default-semibold]Left click:[/font] blue portal\n[font=default-semibold]Right click:[/font] orange portal\n[font=default-semibold]Shift + click:[/font] close the portal of that colour\nPortals can't open on water, buildings, trees, rocks or cliffs.

[entity-name]
portal-guns-portal-blue=Blue portal
portal-guns-portal-orange=Orange portal
portal-guns-placement-probe=Portal placement probe

[entity-description]
portal-guns-portal-blue=Whatever steps in comes out of the orange portal of the same owner. Mine it to close it.
portal-guns-portal-orange=Whatever steps in comes out of the blue portal of the same owner. Mine it to close it.

[technology-name]
portal-gun=Portal gun

[technology-description]
portal-gun=A handheld device that opens two linked portals. Travel, haul a tank across the map at full speed, or send a biter attack somewhere it will regret.

[shortcut-name]
portal-guns-close-portals=Close my portals

[controls]
portal-guns-close-portals=Close my portals

[mod-setting-name]
portal-guns-range=Portal gun range
portal-guns-teleport-vehicles=Vehicles use portals
portal-guns-teleport-units=Biters and other units use portals
portal-guns-cross-surface=Link portals across surfaces
portal-guns-owner-labels=Show portal owners in alt mode

[mod-setting-description]
portal-guns-range=How far a portal shot flies, in tiles. Shots aimed further land at this distance.
portal-guns-teleport-vehicles=Cars, tanks and spidertrons go through portals (with their passengers). Cars keep their speed.
portal-guns-teleport-units=Biters, spitters and other units that walk into a portal come out of the other one.
portal-guns-cross-surface=Allow a blue portal on one surface (planet) to connect with an orange portal on another. Only characters, cars, tanks and spidertrons can make that trip. Off by default because it skips rockets and space platforms.
portal-guns-owner-labels=Writes the owner's name above every portal while alt mode is on.

[portal-guns]
fizzle=Can't open a portal here
too-close=Too close to another portal
failed=The portal couldn't open
wrong-surface=You can only shoot portals on the surface you are on
no-body=You need a body to fire the portal gun
no-portals=You have no open portals
